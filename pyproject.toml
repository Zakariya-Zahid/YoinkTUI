[project]
name = "yoinktui"
version = "0.1.0"
description = "Steam-style TUI download manager for YouTube and 1000+ sites via yt-dlp + ffmpeg"
readme = "README.md"
authors = [
    { name = "Zakariya Zahid", email = "zakryiabukhari@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
]

[project.scripts]
yoinktui = "yoinktui.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
