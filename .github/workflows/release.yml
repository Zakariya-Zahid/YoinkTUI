name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel installation and smoke test
        run: |
          uv venv /tmp/release-venv --python 3.12
          uv pip install --python /tmp/release-venv/bin/python dist/*.whl
          /tmp/release-venv/bin/yoinktui --version
          /tmp/release-venv/bin/yoinktui --print-config | head -10
          /tmp/release-venv/bin/yoinktui --doctor || true
          /tmp/release-venv/bin/python - <<'PY'
          from importlib.resources import files
          pkg = files("yoinktui")
          assert pkg.joinpath("tui", "app.tcss").is_file(), "Missing CSS"
          assert pkg.joinpath("assets", "logo-dark.png").is_file(), "Missing assets"
          print("All release data files verified.")
          PY

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  release-github:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: pypi
      url: https://pypi.org/p/yoinktui
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
